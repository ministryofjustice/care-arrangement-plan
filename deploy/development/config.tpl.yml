apiVersion: v1
kind: ConfigMap
metadata:
  name: ${KUBE_NAMESPACE}-config
  namespace: ${KUBE_NAMESPACE}
data:
  NODE_ENV: 'production'
  USE_HTTPS: 'true'
  STATIC_RESOURCE_CACHE_DURATION: '1h'
  WEB_SESSION_TIMEOUT_IN_MINUTES: '120'
  CACHE_ENABLED: 'true'
  CACHE_TLS_ENABLED: 'true'
  INCLUDE_WELSH_LANGUAGE: 'true'
  USE_AUTH: 'true'
  AUTH_PROVIDER: 'one-login'
  ONE_LOGIN_ISSUER: 'https://oidc.integration.account.gov.uk/'
  ONE_LOGIN_REDIRECT_URL: 'https://care-arrangement-plan-dev.apps.live.cloud-platform.service.justice.gov.uk/oidc/authorization-code/callback'
  ONE_LOGIN_POST_LOGOUT_REDIRECT_URL: 'https://care-arrangement-plan-dev.apps.live.cloud-platform.service.justice.gov.uk/signed-out'
  ONE_LOGIN_SCOPES: 'openid,email'
  ONE_LOGIN_VTR: 'Cl.Cm'
  CONTACT_EMAIL: 'feedback@propose-child-arrangements-plan.service.gov.uk'
  FEEDBACK_URL: 'https://www.gov.uk/done/propose-child-arrangements-plan'
  PREVIEW_END: '2026-03-31T23:59:59'
  GA4_ID: 'CAP-DEV-TEST-GA4-ID'
  ENABLE_ANALYTICS: 'false'
  SERVICE_URL: 'https://care-arrangement-plan-dev.apps.live.cloud-platform.service.justice.gov.uk'
